plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv("SIGNING_STORE_FILE")
def releaseStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
def releaseKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.gazelle.launcher"
        minSdk 21
        targetSdk 34
        versionCode 10612
        versionName "1.6.1-gazelle.11"
    }

    signingConfigs {
        debug {
            // Android Gradle Plugin creates/uses the standard debug key.
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
