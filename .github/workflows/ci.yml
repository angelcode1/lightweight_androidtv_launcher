name: Gazelle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Assert tests exist
        run: test -n "$(find app/src/test -type f -name '*Test.kt' -print -quit)"

      - name: Assert removed stacks stay removed
        run: |
          if grep -RniE "appcompat|recyclerview|constraintlayout|androidx\.work" app/src app/build.gradle; then
            echo "Removed runtime stack referenced again."
            exit 1
          fi

      - name: Inspect runtime dependency graph
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > runtime-deps.txt
          if grep -iE "androidx\.appcompat|androidx\.recyclerview|androidx\.constraintlayout|androidx\.work" runtime-deps.txt; then
            cat runtime-deps.txt
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble unsigned release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload unsigned release verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
