name: Gazelle CI

on:
  push:
    branches: [gazelle]
  pull_request:
    branches: [gazelle]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Assert tests exist
        run: test -n "$(find app/src/test -type f -name '*Test.kt' -print -quit)"

      - name: Assert removed stacks stay removed
        run: |
          if grep -RniE "appcompat|recyclerview|constraintlayout|androidx\.work" app/src app/build.gradle; then
            echo "Removed runtime stack referenced again."
            exit 1
          fi

      - name: Inspect runtime dependency graph
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > runtime-deps.txt
          if grep -iE "androidx\.appcompat|androidx\.recyclerview|androidx\.constraintlayout|androidx\.work" runtime-deps.txt; then
            cat runtime-deps.txt
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble unsigned release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk


      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-launcher-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
