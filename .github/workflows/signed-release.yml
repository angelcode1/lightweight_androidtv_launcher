name: Cut signed Gazelle release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gazelle-signed-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Require permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.GAZELLE_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GAZELLE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAZELLE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAZELLE_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing GAZELLE_SIGNING_KEYSTORE_B64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing GAZELLE_SIGNING_STORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing GAZELLE_SIGNING_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing GAZELLE_SIGNING_KEY_PASSWORD'; exit 1; }
          KEYSTORE="$RUNNER_TEMP/gazelle-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Run tests and lint
        run: ./gradlew test lint --no-daemon

      - name: Build permanently signed release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signed APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/gazelle-launcher-${VERSION}-release-signed.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-launcher-${{ steps.version.outputs.name }}-signed
          path: dist/*
          if-no-files-found: error

      - name: Create signed GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Fire TV Cube 3 Gazelle Launcher permanently signed prerelease.

          Version code: $VERSION_CODE

          This APK is signed with the permanent Gazelle release key.
          Future releases using the same GitHub signing secrets can update it in place.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Gazelle Launcher $VERSION" \
              --prerelease \
              --notes-file release-notes.md
          fi
