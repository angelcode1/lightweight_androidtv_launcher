name: Cut signed Gazelle release
run-name: Gazelle permanent release ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional setup request ID for tracking this release'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'app/build.gradle'
      - '.github/release-trigger'

permissions:
  contents: write

concurrency:
  group: gazelle-signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Require and verify the permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.GAZELLE_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GAZELLE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAZELLE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAZELLE_SIGNING_KEY_PASSWORD }}
        run: python3 tools/release_signing.py prepare "$RUNNER_TEMP/gazelle-release.p12"

      - name: Test signing and release contracts
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Read version and refuse tag reuse
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          text = pathlib.Path('app/build.gradle').read_text()
          names = re.findall(r'^\s*versionName\s+"([0-9A-Za-z.-]+)"', text, re.M)
          codes = re.findall(r'^\s*versionCode\s+(\d+)', text, re.M)
          if len(names) != 1 or len(codes) != 1:
              raise SystemExit('Expected exactly one version name and code')
          tag = 'v' + names[0]
          if subprocess.run(['git', 'show-ref', '--verify', '--quiet', 'refs/tags/' + tag]).returncode == 0:
              raise SystemExit('Tag already exists; bump versionName and versionCode')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={names[0]}\ncode={codes[0]}\ntag={tag}\n')
          PY

      - name: Test, lint and build the permanent-key release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/gazelle-release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.GAZELLE_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.GAZELLE_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.GAZELLE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew test lint assembleRelease --no-daemon

      - name: Verify APK identity and permanent signature; stage matching assets
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk
          BT=/usr/local/lib/android/sdk/build-tools/34.0.0
          BADGING="$("$BT/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "name='com.gazelle.launcher'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$VERSION_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          mkdir -p dist
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-CERTIFICATE.txt
          python3 tools/release_signing.py verify dist/APK-CERTIFICATE.txt
          cp "$APK" "dist/gazelle-launcher-${VERSION}-release-signed.apk"
          MODULE_DIR="$RUNNER_TEMP/gazelle-launcher-privileged"
          mkdir -p "$MODULE_DIR/system/priv-app/GazelleLauncher"
          cp "$APK" "$MODULE_DIR/system/priv-app/GazelleLauncher/GazelleLauncher.apk"
          cat > "$MODULE_DIR/module.prop" <<EOF
          id=gazelle_launcher_privileged
          name=Gazelle Launcher Privileged
          version=$VERSION
          versionCode=$VERSION_CODE
          author=angelcode1
          description=Installs Gazelle Launcher as a privileged Fire OS system launcher
          EOF
          (cd "$MODULE_DIR" && zip -r9 -X "$GITHUB_WORKSPACE/dist/gazelle-launcher-privileged-v${VERSION_CODE}.zip" module.prop system)
          printf 'permanent\n' > dist/SIGNING-MODE.txt
          cp .github/release-signing.json dist/release-signing.json
          python3 - <<'PY'
          import json, os, pathlib
          record = dict(repository=os.environ['GITHUB_REPOSITORY'], commit=os.environ['GITHUB_SHA'],
                        version_name=os.environ['VERSION'], version_code=int(os.environ['VERSION_CODE']),
                        signing_mode='permanent')
          pathlib.Path('dist/source-provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          (cd dist && sha256sum *.apk *.zip *.json APK-CERTIFICATE.txt SIGNING-MODE.txt > SHA256SUMS.txt)

      - name: Upload public release assets
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-launcher-${{ steps.version.outputs.name }}-permanent
          path: dist/*
          if-no-files-found: error

      - name: Publish immutable stable release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Fire TV Cube 3 Gazelle Launcher release.

          Version code: $VERSION_CODE
          Signing mode: permanent
          Certificate SHA256: $(python3 -c 'import json; print(json.load(open(".github/release-signing.json"))["certificate_sha256"])')

          APK and privileged Magisk ZIP contain the same signed application.
          SHA256SUMS.txt lists the exact released bytes. Future releases use
          the same permanent signing key. Existing temporary/test-key APKs
          have a different signer and cannot be upgraded in place.
          Release tags and assets are immutable; every release bumps both versions.
          EOF
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Gazelle Launcher $VERSION" --latest --notes-file release-notes.md

      - name: Remove private keystore from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/gazelle-release.p12"
