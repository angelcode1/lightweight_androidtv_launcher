name: Cut signed Gazelle release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

concurrency:
  group: gazelle-signed-release
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse version/tag reuse
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump versionName/versionCode before releasing."
            exit 1
          fi

      - name: Run tests and lint
        run: ./gradlew test lint --no-daemon

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.GAZELLE_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GAZELLE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAZELLE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAZELLE_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/gazelle-release.jks"

          present=0
          [ -n "$KEYSTORE_B64" ] && present=$((present + 1))
          [ -n "$STORE_PASSWORD" ] && present=$((present + 1))
          [ -n "$KEY_ALIAS" ] && present=$((present + 1))
          [ -n "$KEY_PASSWORD" ] && present=$((present + 1))

          if [ "$present" -eq 4 ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "mode=permanent" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            keytool -genkeypair               -keystore "$KEYSTORE"               -storetype JKS               -storepass gazelle-temp-build               -keypass gazelle-temp-build               -alias gazelle-temp               -keyalg RSA               -keysize 4096               -validity 3650               -dname "CN=Gazelle Launcher Temporary Build, O=angelcode1"
            chmod 600 "$KEYSTORE"
            echo "mode=temporary" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets are partially configured. Configure all four or remove them all."
            exit 1
          fi

      - name: Build permanently signed release APK
        if: steps.signing.outputs.mode == 'permanent'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/gazelle-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.GAZELLE_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.GAZELLE_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.GAZELLE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build temporary-key signed release APK
        if: steps.signing.outputs.mode == 'temporary'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/gazelle-release.jks
          SIGNING_STORE_PASSWORD: gazelle-temp-build
          SIGNING_KEY_ALIAS: gazelle-temp
          SIGNING_KEY_PASSWORD: gazelle-temp-build
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature and stage release assets
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p dist
          VERSION="${{ steps.version.outputs.name }}"
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner \
            verify --verbose --print-certs "$APK" | tee dist/APK-CERTIFICATE.txt
          cp "$APK" "dist/gazelle-launcher-${VERSION}-release-signed.apk"

          MODULE_DIR="$RUNNER_TEMP/gazelle-launcher-privileged"
          mkdir -p "$MODULE_DIR/system/priv-app/GazelleLauncher"
          cp "$APK" "$MODULE_DIR/system/priv-app/GazelleLauncher/GazelleLauncher.apk"
          cat > "$MODULE_DIR/module.prop" <<EOF
          id=gazelle_launcher_privileged
          name=Gazelle Launcher Privileged
          version=$VERSION
          versionCode=${{ steps.version.outputs.code }}
          author=angelcode1
          description=Installs Gazelle Launcher as a privileged Fire OS system launcher
          EOF
          (
            cd "$MODULE_DIR"
            zip -r9 -X "$GITHUB_WORKSPACE/dist/gazelle-launcher-privileged-v${{ steps.version.outputs.code }}.zip" module.prop system
          )

          printf '%s\n' "${{ steps.signing.outputs.mode }}" > dist/SIGNING-MODE.txt
          (cd dist && sha256sum *.apk *.zip > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-launcher-${{ steps.version.outputs.name }}-signed
          path: dist/*
          if-no-files-found: error

      - name: Create immutable signed GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Fire TV Cube 3 Gazelle Launcher signed prerelease.

          Version code: $VERSION_CODE
          Signing mode: $SIGNING_MODE

          If Signing mode is temporary, this APK uses a one-time runner-generated key.
          A future permanent-key build will require one uninstall/reinstall transition.
          Release tags and assets are immutable: bump versionName/versionCode for every new release.
          EOF
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Gazelle Launcher $VERSION" \
            --prerelease \
            --notes-file release-notes.md
