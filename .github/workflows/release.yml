name: Build unsigned Gazelle verification APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Run tests, lint, and release build
        run: ./gradlew test lint assembleRelease --no-daemon

      - name: Stage unsigned verification APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/gazelle-launcher-${VERSION}-release-unsigned.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload unsigned verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-launcher-${{ steps.version.outputs.name }}-unsigned-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
