name: Cut Gazelle prerelease

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: gazelle-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ steps.version.outputs.name }}"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/gazelle-launcher-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/gazelle-launcher-${VERSION}-release-unsigned.apk"
          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gazelle-launcher-${{ steps.version.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing assets."
            gh release upload "$TAG" dist/* --clobber
          else
            cat > release-notes.md <<EOF
          Fire TV Cube 3 (AFTGAZL) Gazelle Launcher prerelease.

          Version code: $VERSION_CODE

          Assets:
          - debug APK: installable test build, signed with the standard CI debug key
          - release-unsigned APK: R8/shrinkResources build, not installable until signed with the permanent Gazelle key
          - SHA256SUMS.txt

          Full Android/AAPT/lint/R8 and on-device validation should be treated as release gates before promoting this prerelease.
          EOF
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Gazelle Launcher $VERSION" \
              --prerelease \
              --notes-file release-notes.md
          fi
